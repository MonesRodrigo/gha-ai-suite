version: 2
updates:
  - package-ecosystem: github-actions
    # Composite actions live outside .github/workflows and need their own entry.
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /actions/a11y
    schedule:
      interval: weekly
    groups:
      a11y:
        patterns: ["*"]
